.w{font-family:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;font-weight:500;font-size:24px;letter-spacing:.055em}
.datum{transform-box:fill-box;transform-origin:0 50%;animation:sweep 700ms cubic-bezier(.4,0,.2,1) backwards}
.trace circle,.trace path{animation:trace 1000ms cubic-bezier(.4,0,.2,1) 200ms backwards}

<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
.k{font-family:'JetBrains Mono', ui-monospace, monospace;font-weight:400;font-size:17px;letter-spacing:.14em}

<g id="c2" class="rv" style="animation-delay:660ms"><svg id="i2" x="470" y="72" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#d8c9a3"><path d="M32 12L58 24L32 36L6 24Z"/><path d="M16 29V40C16 44.5 23 48 32 48S48 44.5 48 40V29"/><path d="M58 24V38"/></svg><text id="g2" class="jb" x="502" y="203.3" text-anchor="middle" fill="#94a3b8">02</text><text id="n2" class="sg" x="502" y="237.45" text-anchor="middle" fill="#ffffff">On forme vos équipes</text></g>

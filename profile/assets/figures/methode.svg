<g id="c4" class="rv" style="animation-delay:980ms"><svg id="i4" x="1022" y="72" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#d8c9a3"><path d="M10 40V52H54V40"/><path d="M32 44V10M20 22L32 10L44 22"/></svg><text id="g4" class="jb" x="1054" y="203.3" text-anchor="middle" fill="#94a3b8">04</text><text id="n4" class="sg" x="1054" y="237.45" text-anchor="middle" fill="#ffffff">On livre le système</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="titre">
<title id="titre">Notre méthode a quatre étapes : on montre nos preuves, on forme vos équipes, on fixe vos priorités, on livre le système.</title>
<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
.sg{font-family:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;font-weight:500;font-size:22px;letter-spacing:-0.01em}
.jb{font-family:'JetBrains Mono', ui-monospace, monospace;font-weight:400;font-size:15px;letter-spacing:.14em}
.datum{transform-box:fill-box;transform-origin:0 50%;animation:sweep 700ms cubic-bezier(.4,0,.2,1) backwards}
.rv{animation:rv 500ms cubic-bezier(.2,.7,.2,1) backwards}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.datum,.rv{animation:none}}
</style>
